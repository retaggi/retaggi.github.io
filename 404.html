<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pagina non trovata · Palestrando</title>
    <meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/logo/palestrando-icona.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/icons/palestrando-icona-48.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/assets/icons/palestrando-icona-192.png" />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <main class="narrow">
      <header class="site-header">
        <a href="/" aria-label="Palestrando, pagina iniziale">
          <picture>
            <source
              srcset="/assets/logo/palestrando-logo-orizzontale-scuro.svg"
              media="(prefers-color-scheme: dark)"
            />
            <img
              src="/assets/logo/palestrando-logo-orizzontale.svg"
              alt="Palestrando"
              width="175"
              height="40"
            />
          </picture>
        </a>
      </header>
      <div class="now-card">
        <span class="label">Errore 404</span>
        <h1>Questa pagina non c'è</h1>
        <p class="muted" style="color: var(--ink-text)">
          Il link è sbagliato o la pagina è stata spostata.
        </p>
      </div>
      <a class="button" href="/">Torna alla pagina iniziale</a>
    </main>
  </body>
</html>
